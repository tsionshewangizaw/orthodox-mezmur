name: mezmur2
description: Orthodox Mezmur App
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  google_fonts: ^6.1.0
  just_audio: ^0.9.36
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/splash.png

flutter_native_splash:    # ← Must be at ROOT level, NOT indented under flutter
  color: "#000000"
  image: assets/splash.png
  android: true